<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>NEXABASE — Backend Platform</title>
<style>
:root{--bg:#090d18;--panel:#101827;--panel2:#131f31;--line:#223149;--muted:#8fa1b9;--text:#e8eff9;--green:#3ecf8e;--blue:#62a7ff;--red:#ff737e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial}button,input,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:248px;background:#0c1321;border-right:1px solid var(--line);padding:20px 14px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:1px;padding:4px 9px 24px}.logo{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,#3ecf8e,#3984ed);display:grid;place-items:center;color:#07131b;font-weight:900}.workspace{margin:0 4px 20px;padding:11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px}.workspace b{display:block;color:var(--text);font-size:13px;margin-top:3px}.navlabel{color:#64758e;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:12px 10px 7px}.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#9aabc1;text-align:left;padding:10px;border-radius:8px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#17253a;color:#fff}.nav button.active{box-shadow:inset 2px 0 var(--green)}.ico{width:18px;text-align:center}.sidebottom{position:sticky;top:90vh;margin-top:40px;border-top:1px solid var(--line);padding:14px 8px;color:var(--muted);font-size:12px}.main{flex:1;min-width:0}.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0b1220}.crumb{color:var(--muted)}.crumb b{color:var(--text)}.topright{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);border-radius:20px;padding:6px 11px;color:var(--muted);font-size:12px}.avatar{width:30px;height:30px;border-radius:50%;background:#24435b;display:grid;place-items:center}.content{padding:30px;max-width:1250px;margin:auto}.heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:23px}.heading h1{font-size:24px;margin:0 0 5px}.sub{color:var(--muted)}.btn{border:1px solid var(--line);background:#17253a;color:var(--text);border-radius:8px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#062015;font-weight:750}.btn:hover{filter:brightness(1.12)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}.statlabel{color:var(--muted);font-size:12px}.stat{font-size:25px;font-weight:750;margin:8px 0 2px}.positive{color:var(--green);font-size:11px}.section{margin-top:22px}.section h2{font-size:15px;margin:0 0 13px}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.project{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.project:last-child{border:0}.projectname{display:flex;align-items:center;gap:11px}.dbicon{width:34px;height:34px;border-radius:9px;background:#173b36;color:var(--green);display:grid;place-items:center}.tag{font-size:11px;color:var(--green);background:#12352c;border-radius:20px;padding:4px 8px}.activity{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:6px}.empty{padding:35px;text-align:center;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panelbody{padding:17px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-weight:600}.code{background:#080e19;border:1px solid var(--line);border-radius:9px;padding:15px;color:#a8d7c2;font:12px/1.8 ui-monospace,monospace;min-height:130px;white-space:pre-wrap}.field{background:#0a1220;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;width:100%;margin:7px 0 12px}.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}.modal{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(420px,100%)}.modal h3{margin-top:0}.muted{color:var(--muted)}.hide{display:none!important}.notice{border:1px solid #725d2d;background:#302817;color:#e9d49a;padding:12px;border-radius:9px;font-size:12px;margin-top:16px}
@media(max-width:850px){.side{width:65px;padding:15px 8px}.brand{padding:4px 8px 22px}.brand span,.workspace,.navlabel,.nav button .txt,.sidebottom{display:none}.nav button{justify-content:center}.content{padding:20px 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.top{padding:0 15px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.heading{align-items:flex-start;flex-direction:column}.stat{font-size:21px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">N</div><span>NEXABASE</span></div><div class="workspace">WORKSPACE<b>Personal Workspace⌄</b></div><nav class="nav"><div class="navlabel">PLATFORM</div><button class="active" data-page="overview"><span class="ico">▦</span><span class="txt">Overview</span></button><button data-page="projects"><span class="ico">◈</span><span class="txt">Projects</span></button><button data-page="database"><span class="ico">▤</span><span class="txt">Database</span></button><button data-page="sql"><span class="ico">⌘</span><span class="txt">SQL Editor</span></button><button data-page="auth"><span class="ico">♙</span><span class="txt">Authentication</span></button><button data-page="storage"><span class="ico">▧</span><span class="txt">Storage</span></button><div class="navlabel">DEVELOPER</div><button data-page="api"><span class="ico">⌁</span><span class="txt">API & Keys</span></button><button data-page="logs"><span class="ico">≋</span><span class="txt">Logs</span></button><button data-page="settings"><span class="ico">⚙</span><span class="txt">Settings</span></button></nav><div class="sidebottom">NEXABASE Starter · v0.1.0</div></aside><main class="main"><header class="top"><div class="crumb">Workspace / <b id="crumb">Overview</b></div><div class="topright"><span class="pill">● Local demo</span><div class="avatar">N</div></div></header><div class="content" id="view"></div></main></div>
<div class="modalback" id="modal"><div class="modal"><h3>Buat project baru</h3><label class="muted">Nama project</label><input id="projectName" class="field" placeholder="contoh: toko-online"><label class="muted">Region</label><select id="region" class="field"><option>Singapore</option><option>Jakarta (planned)</option></select><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="addProject()">Buat project</button></div></div></div>
<script>
const pages={overview:'Overview',projects:'Projects',database:'Database',sql:'SQL Editor',auth:'Authentication',storage:'Storage','api':'API & Keys',logs:'Logs',settings:'Settings'};let projects=JSON.parse(localStorage.getItem('nexa_projects')||'[{"name":"project-utama","region":"Singapore","status":"Active"}]');let current='overview';const view=document.getElementById('view');function save(){localStorage.setItem('nexa_projects',JSON.stringify(projects))}function projectRows(){return projects.map((p,i)=>`<div class="project"><div class="projectname"><div class="dbicon">▤</div><div><b>${esc(p.name)}</b><div class="muted" style="font-size:11px">${esc(p.region)} · PostgreSQL</div></div></div><span class="tag">${p.status}</span></div>`).join('')||'<div class="empty">Belum ada project. Buat project pertama Anda.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){current=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=pages[p];render()}function head(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}function render(){let html='';if(current==='overview'){html=head('Selamat datang di NEXABASE 👋','Backend workspace Anda, semua layanan dalam satu tempat.','<button class="btn primary" onclick="openModal()">＋ Project baru</button>')+`<div class="grid"><div class="card"><div class="statlabel">Total Projects</div><div class="stat">${projects.length}</div><div class="positive">● Workspace aktif</div></div><div class="card"><div class="statlabel">Database</div><div class="stat">${projects.length}</div><div class="positive">PostgreSQL projects</div></div><div class="card"><div class="statlabel">API Requests</div><div class="stat">—</div><div class="muted" style="font-size:11px">Belum terhubung</div></div><div class="card"><div class="statlabel">Storage Used</div><div class="stat">—</div><div class="muted" style="font-size:11px">Belum terhubung</div></div></div><div class="section twocol"><div class="panel"><div class="panelhead"><b>Project Anda</b><button class="btn" onclick="go('projects')">Lihat semua →</button></div><div class="panelbody">${projectRows()}</div></div><div class="panel"><div class="panelhead"><b>Aktivitas terbaru</b></div><div class="panelbody"><div class="activity"><span class="dot"></span><span>Workspace NEXABASE dibuat<br><small>Baru saja</small></span></div><div class="activity"><span class="dot"></span><span>Dashboard siap digunakan<br><small>Starter v0.1</small></span></div></div></div></div><div class="notice">Mode demo: data project tersimpan di browser perangkat ini. Database PostgreSQL, login sungguhan, API publik, dan upload permanen belum diaktifkan.</div>`}
else if(current==='projects'){html=head('Projects','Kelola semua project backend Anda.','<button class="btn primary" onclick="openModal()">＋ Project baru</button>')+`<div class="panel"><div class="panelhead"><b>Semua projects (${projects.length})</b><span class="muted">Personal workspace</span></div><div class="panelbody">${projectRows()}</div></div>`}
else if(current==='database'){html=head('Database','Kelola tabel dan data PostgreSQL.','<button class="btn" onclick="go(\'sql\')">Buka SQL Editor</button>')+`<div class="panel"><div class="panelhead"><b>Table Editor</b><span class="tag">PostgreSQL · planned</span></div><div class="empty"><div style="font-size:30px">▤</div><b>Database belum terhubung</b><p>Hubungkan instance PostgreSQL untuk membuat tabel dan mengelola data secara langsung.</p></div></div>`}
else if(current==='sql'){html=head('SQL Editor','Tulis dan jalankan query SQL pada database Anda.')+`<div class="panel"><div class="panelhead"><b>Untitled query</b><button class="btn primary" onclick="runSql()">▶ Jalankan</button></div><div class="panelbody"><textarea id="sqltext" class="field" rows="7" style="font-family:monospace" spellcheck="false">SELECT 'Halo NEXABASE' AS message;</textarea><div id="sqlresult" class="code">Query belum dijalankan.</div><div class="notice">Editor ini hanya simulasi antarmuka. Query belum dikirim ke server/database.</div></div></div>`}
else if(current==='auth'){html=head('Authentication','Atur pengguna, login, dan kebijakan akses.')+`<div class="grid"><div class="card"><div class="statlabel">Total users</div><div class="stat">—</div><div class="muted">Belum ada provider</div></div><div class="card"><div class="statlabel">Providers</div><div class="stat">0</div><div class="muted">Belum dikonfigurasi</div></div></div><div class="section panel"><div class="panelhead"><b>Sign-in providers</b></div><div class="panelbody">Email & Password <span class="tag">Planned</span><p class="muted">Google OAuth · Magic Link · Email OTP</p></div></div>`}
else if(current==='storage'){html=head('Storage','Simpan dan sajikan file aplikasi.')+`<div class="panel"><div class="panelhead"><b>Buckets</b><button class="btn" onclick="alert('Storage aktif setelah backend dipasang.')">＋ New bucket</button></div><div class="empty">▧<p>Belum ada storage bucket.</p><span class="muted">File storage permanen memerlukan object storage backend.</span></div></div>`}
else if(current==='api'){html=head('API & Keys','Informasi endpoint dan kredensial project.')+`<div class="panel"><div class="panelbody"><b>Project URL</b><div class="code">Belum tersedia — backend belum diterapkan.</div><br><b>API Keys</b><div class="code">Publishable key: belum dibuat\nSecret key: belum dibuat</div><div class="notice">Jangan pernah menaruh secret key di frontend atau membagikannya kepada orang lain.</div></div></div>`}
else if(current==='logs'){html=head('Logs','Pantau aktivitas dan error layanan.')+`<div class="panel"><div class="panelhead"><b>System logs</b><span class="tag">Demo</span></div><div class="empty">Belum ada log server. Log akan tampil setelah backend berjalan.</div></div>`}
else if(current==='settings'){html=head('Settings','Pengaturan workspace NEXABASE.')+`<div class="panel"><div class="panelbody"><b>Workspace name</b><input class="field" value="Personal Workspace"><b>Language</b><input class="field" value="Bahasa Indonesia" disabled><b>Appearance</b><input class="field" value="Dark mode" disabled><button class="btn primary" onclick="alert('Pengaturan demo disimpan di tampilan ini.')">Simpan pengaturan</button></div></div>`}view.innerHTML=html}
function openModal(){document.getElementById('modal').style.display='flex';document.getElementById('projectName').focus()}function closeModal(){document.getElementById('modal').style.display='none'}function addProject(){let n=document.getElementById('projectName').value.trim();if(!n)return alert('Masukkan nama project.');projects.push({name:n,region:document.getElementById('region').value,status:'Active'});save();closeModal();go('projects')}function runSql(){let q=document.getElementById('sqltext').value;document.getElementById('sqlresult').textContent='DEMO MODE\nQuery diterima oleh editor (simulasi):\n'+q+'\n\nTidak ada database yang dieksekusi.'}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
</script></body></html>
